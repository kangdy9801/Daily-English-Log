<section class="paper-shell">
  <div class="paper-page">
    <div class="paper-header">
      <div class="paper-title-small">PRIVATE JOURNAL</div>
      <h1>My English Diary</h1>
      <p class="paper-subtitle">하루 한 페이지, 영어로 기록하기.</p>
    </div>

    <div class="toolbar">
      <div class="toolbar-left">
        <label for="diaryDate">일기 날짜</label>
        <input type="date" id="diaryDate" />
      </div>

      <div class="toolbar-right">
        <button id="saveBtn">일기 저장</button>
        <button id="reloadBtn" class="secondary">다시 불러오기</button>
        <button id="backupBtn" class="secondary">전체 JSON 백업</button>
        <button id="logoutBtn" class="secondary">로그아웃</button>
      </div>
    </div>

    <div id="statusMsg" class="status-msg"></div>

    <div class="editor-grid">
      <aside class="past-diary-panel">
        <h3>지난 일기</h3>
        <div id="pastDiaryList">아직 저장한 일기가 없습니다.</div>
      </aside>

      <main class="diary-main">
        <section class="diary-input-wrap">
          <div class="input-col">
            <h3>01 · 한국어 메모</h3>
            <textarea id="memoInput" placeholder="오늘 있었던 일을 자유롭게 메모하세요."></textarea>
          </div>

          <div class="input-col">
            <h3>02 · English diary</h3>
            <textarea id="originalInput" placeholder="Write your English diary here."></textarea>
          </div>
        </section>

        <div class="action-row">
          <button id="correctBtn" class="primary">AI 영어 교정</button>
          <label class="check-row">
            <input type="checkbox" id="showPronounceKo" />
            한국어 발음 표시
          </label>
          <label>
            속도
            <select id="speechRate">
              <option value="0.8">천천히</option>
              <option value="1" selected>보통</option>
              <option value="1.15">조금 빠르게</option>
            </select>
          </label>
          <button id="speakAllBtn" class="secondary">전체 교정문 듣기</button>
          <button id="stopSpeakBtn" class="secondary">음성 정지</button>
        </div>

        <p class="helper-note">
          AI 교정 시 영어 일기 원문만 외부 AI 서비스로 전송됩니다. 한국어 메모는 전송하지 않습니다.
        </p>

        <section class="correction-paper">
          <div class="correction-paper-header">
            <h2>03 · 전체 첨삭</h2>
          </div>

          <div id="annotatedDiary" class="annotated-diary empty-state">
            아직 교정 결과가 없습니다. 영어 일기를 작성하고 AI 교정을 눌러보세요.
          </div>

          <div id="pronounceKoWrap" class="pronounce-ko-wrap hidden">
            <h3>한국어 발음</h3>
            <div id="pronounceKoContent"></div>
          </div>
        </section>

        <section class="grammar-section">
          <h2>04 · 표현 / 문법 포인트</h2>
          <div id="grammarPoints" class="grammar-points empty-state">
            아직 문법 포인트가 없습니다.
          </div>
        </section>

        <section class="full-corrected-section">
          <h2>05 · 교정된 전체 일기</h2>
          <div id="correctedDiaryText" class="corrected-diary-box">
            아직 교정문이 없습니다.
          </div>
        </section>

        <button id="deleteBtn" class="danger-outline">선택한 일기 삭제</button>
      </main>
    </div>
  </div>
</section>
